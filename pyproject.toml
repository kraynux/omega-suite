[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omega-suite"
version = "1.5.0"
description = "Interface unifiee omega-suite : omega-scan/check/deep/fold/stress/track/fuzz en onglets d'une seule application"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "kraynux", email = "kraynux@proton.me" }]
requires-python = ">=3.10"
dependencies = [
    "omega-lib>=0.1.0",
    "omega-scan>=2.5.0",
    "omega-check>=1.5.0",
    "omega-deep>=1.5.0",
    "omega-fold>=1.5.0",
    "omega-stress>=1.5.0",
    "omega-track>=1.5.0",
    "omega-fuzz>=1.5.0",
    "textual>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[project.scripts]
omega-suite = "omega_suite.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omega_suite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_classes = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

# Les 7 outils n'exposent pas de marqueur py.typed (aucun n'a ete concu
# pour etre importe comme dependance typee - omega-suite est le premier
# a le faire) : ignore_missing_imports evite un bruit mypy sans rapport
# avec le code d'omega-suite lui-meme.
[[tool.mypy.overrides]]
module = [
    "omega_scan.*",
    "omega_check.*",
    "omega_deep.*",
    "omega_fold.*",
    "omega_stress.*",
    "omega_track.*",
    "omega_fuzz.*",
]
ignore_missing_imports = true

# omega-suite n'a pas les 9 couches des 7 outils (D-000) : ce n'est pas
# une application metier, juste une racine de composition (app/) plus
# une interface (interfaces/) qui orchestre les 7 outils installes comme
# dependances - voir OMEGA-SUITE_ARBORESCENCE.md §2.
[tool.importlinter]
root_package = "omega_suite"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "textual seulement dans interfaces.tui"
type = "forbidden"
source_modules = ["omega_suite.app", "omega_suite.interfaces.cli"]
forbidden_modules = ["textual"]
